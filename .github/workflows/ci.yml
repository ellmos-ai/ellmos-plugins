name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools>=77.0.3
          python -m pip install -e ".[dev]"

      - name: Check formatting and whitespace
        run: git diff --check

      - name: Run Ruff lint
        run: ruff check .

      - name: Bytecode compile check
        run: python -m compileall -q tools tests

      - name: Run pytest contract suite
        run: pytest -ra -v

      - name: Check dependency consistency
        run: pip check

      - name: Dry-run package install
        run: pip install --no-build-isolation --dry-run .
