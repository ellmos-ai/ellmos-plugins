<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Cascadia Code', Consolas, Monaco, monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glow-p" cx="170" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-s" cx="550" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glassmorphic Elements -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Technical Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="170" cy="140" r="200" fill="url(#glow-p)" />
  <circle cx="550" cy="160" r="220" fill="url(#glow-s)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#6366f1" />

  <!-- Left Domain Graphic Motif (x=40..310, y=30..270) -->
  
    <!-- Ellmos Plugins: Hexagonal Plugin Marketplace Grid -->
    <g transform="translate(45, 35)">
      <!-- Hexagonal Honeycomb Pattern of Plugin Sockets -->
      <!-- Center Main Plugin Socket -->
      <g transform="translate(105, 75)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" filter="url(#drop-shadow)"/>
        <circle cx="25" cy="30" r="8" fill="#10b981"/>
        <text x="15" y="48" class="font-mono" font-size="6" font-weight="700" fill="#f8fafc">CORE</text>
      </g>

      <!-- Top Hexagon -->
      <g transform="translate(105, 20)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#6366f1"/>
      </g>

      <!-- Bottom Hexagon -->
      <g transform="translate(105, 130)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#10b981"/>
      </g>

      <!-- Left-Top Hexagon -->
      <g transform="translate(58, 47)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#10b981"/>
      </g>

      <!-- Left-Bottom Hexagon -->
      <g transform="translate(58, 102)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#6366f1"/>
      </g>

      <!-- Right-Top Hexagon -->
      <g transform="translate(152, 47)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#6366f1"/>
      </g>

      <!-- Right-Bottom Hexagon -->
      <g transform="translate(152, 102)">
        <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="25" cy="30" r="5" fill="#10b981"/>
      </g>

      <!-- Marketplace CLI Command Badge -->
      <g transform="translate(40, 185)">
        <rect width="180" height="20" rx="4" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
        <text x="12" y="14" class="font-mono" font-size="7.5" font-weight="700" fill="#10b981">/plugin marketplace add ellmos-ai</text>
      </g>
    </g>
    

  <!-- Vertical Divider Line -->
  <line x1="330" y1="35" x2="330" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Right Branding & Meta Information (x=360..1160) -->
  <g transform="translate(360, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="294.40000000000003" height="24" rx="5" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#6366f1">ELLMOS-AI // ECOSYSTEM // MARKETPLACE</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="122" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#title-grad)">ellmos-plugins</text>

    <!-- English Subtitle / Tagline -->
    <text x="0" y="158" class="font-sans" font-size="17" font-weight="500" fill="#94a3b8">Plugin Marketplace for Mixed Agent Teams &amp; Workflow Gates</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      
        <g transform="translate(0, 0)">
          <rect width="226" height="30" rx="15" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
          <text x="113.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🔌 Claude Code Marketplace</text>
        </g>
        

        <g transform="translate(238, 0)">
          <rect width="181" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="90.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">👥 Mixed Agent Teams</text>
        </g>
        

        <g transform="translate(431, 0)">
          <rect width="174" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="87.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🛡️ Workflow Gates</text>
        </g>
        

        <g transform="translate(617, 0)">
          <rect width="166" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="83.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🧩 Reusable Skills</text>
        </g>
        
    </g>
  </g>
</svg>